<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <script>
    try {
      var savedScheme = localStorage.getItem('credo-color-scheme');
      var metaScheme = document.querySelector('meta[name="color-scheme"]');
      var metaTheme = document.querySelector('meta[name="theme-color"]');
      var osDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var isDark = savedScheme === 'dark' ? true : savedScheme === 'light' ? false : osDark;
      if (savedScheme === 'dark' || savedScheme === 'light') {
        metaScheme.content = savedScheme;
        document.documentElement.style.colorScheme = savedScheme;
        document.documentElement.dataset.theme = savedScheme;
      } else {
        document.documentElement.style.colorScheme = 'light dark';
      }
      if (metaTheme) metaTheme.content = isDark ? '#000000' : '#FFFFFF';
      if (window.CredoNative && window.CredoNative.setSystemTheme) {
        window.CredoNative.setSystemTheme(isDark);
      }
    } catch (e) {}
  </script>
  <title>Credo — Fe, Comunión y Radio en Vivo</title>
  <meta name="description" content="Feed oficial católico, Aire 96 FM en vivo, Santo Rosario, Liturgia del Día de Reflexionando la Palabra y comunidad de oración." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <link rel="preconnect" href="https://media.credoapp.tech" crossorigin />
  <link rel="dns-prefetch" href="https://media.credoapp.tech" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/credo-32.png" />
  <link rel="apple-touch-icon" href="/icons/credo-180.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/styles.css?v=33" />
  <link rel="stylesheet" href="/credo-one.css?v=40" />
  <link rel="modulepreload" href="/app.js?v=48" />
  <link rel="modulepreload" href="/credo-one-sheet.js?v=48" />
  <link rel="modulepreload" href="/views/feed.js?v=46" />
  <link rel="modulepreload" href="/springs.mjs?v=23" />
  <link rel="modulepreload" href="/audio-engine.js?v=23" />
</head>
<body>
  <!-- Soft progressive top scroll edge blur (functional layer) -->
  <div class="edge-soft" aria-hidden="true"></div>

  <div class="app-shell">
    <!-- Desktop Adaptive Floating Sidebar Rail (Functional Liquid Glass Layer) -->
    <aside class="desktop-sidebar" aria-label="Navegación principal">
      <div class="lg lg-rail" id="desktopRailGlass">
        <div class="lg__shadow" aria-hidden="true"></div>
        <div class="lg__glass" aria-hidden="true"></div>
        <div class="lg__rim" aria-hidden="true"></div>
        <div class="lg__glow" aria-hidden="true"></div>
        <div class="lg__content rail-inner">
          <a href="#/feed" class="brand-lockup" aria-label="Credo Inicio">
            <img class="brand-logo" src="/icons/credo-192.png" alt="" width="40" height="40" />
            <span class="brand-wordmark">
              <strong>Credo</strong>
              <small id="railSubTag">Iglesia Universal</small>
            </span>
          </a>

          <nav class="rail-nav" id="desktopNav" aria-label="Secciones"></nav>

          <div class="rail-footer">
            <button type="button" class="credo-one-trigger credo-one-trigger--rail" id="desktopCredoOneBtn" aria-label="Abrir Familia Credo One">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"/></svg>
              <span>Credo One</span>
            </button>
            <button type="button" class="btn btn-gold btn-block" id="desktopPublishBtn" hidden>
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
              <span data-i18n="feed.publishBtn">Publicar</span>
            </button>
            <button type="button" class="rail-account-chip" id="desktopAccountBtn"></button>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Dynamic View Viewport — ONLY the active route's DOM is mounted here -->
    <main class="main-stage" id="mainStage" tabindex="-1">
      <div id="appView" class="view-mount"></div>
    </main>
  </div>

  <!-- Persistent Floating Liquid Glass Mini-Player (Matching Circular Capsule Island) -->
  <div class="mini-player-anchor" id="miniPlayerAnchor" hidden>
    <div class="lg lg-mini" id="miniPlayerGlass" role="region" aria-label="Reproductor en vivo">
      <div class="lg__shadow" aria-hidden="true"></div>
      <div class="lg__glass" aria-hidden="true"></div>
      <div class="lg__rim" aria-hidden="true"></div>
      <div class="lg__glow" aria-hidden="true"></div>
      <div class="lg__content mini-inner">
        <button type="button" class="mini-expand-hit" id="miniExpandBtn" aria-label="Expandir reproductor">
          <img class="mini-art" id="miniArt" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="" width="40" height="40" />
          <span class="mini-meta">
            <span class="mini-title-row">
              <span class="live-dot" aria-hidden="true"></span>
              <strong id="miniStationName"></strong>
            </span>
            <span class="mini-prog" id="miniProgramName"></span>
          </span>
        </button>
        <div class="mini-controls">
          <button type="button" class="icon-btn-44" id="miniPlayPauseBtn" aria-label="Reproducir o pausar"></button>
          <button type="button" class="icon-btn-44" id="miniCloseBtn" aria-label="Cerrar reproductor">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile Floating Dynamic Island Dock (5 Core Tabs + Apple Spring Sliding Pill) -->
  <nav class="mobile-dock" id="mobileDockNav" aria-label="Navegación móvil">
    <div class="lg lg-dock" id="mobileDockGlass">
      <div class="lg__shadow" aria-hidden="true"></div>
      <div class="lg__glass" aria-hidden="true"></div>
      <div class="lg__rim" aria-hidden="true"></div>
      <div class="lg__glow" aria-hidden="true"></div>
      <div class="lg__content dock-items" id="mobileNav">
        <span class="dock-pill-indicator" id="dockIndicator" aria-hidden="true"></span>
      </div>
    </div>
  </nav>

  <!-- Full-Screen Apple Music-Style Live Audio Player Sheet (1:1 Spring Drag-to-Dismiss) -->
  <div class="full-player-backdrop" id="fullPlayerBackdrop" hidden></div>
  <section class="full-player-sheet" id="fullPlayerSheet" hidden aria-modal="true" role="dialog" aria-label="Reproductor en vivo">
    <div class="fp-bg-glow" id="fpBgGlow" aria-hidden="true"></div>
    <div class="fp-drag-zone" id="fpDragHandle">
      <div class="sheet-grabber" aria-hidden="true"></div>
      <div class="fp-top-row">
        <span class="live-pill-lg"><span class="live-dot" aria-hidden="true"></span><span id="fpLiveBadge">EN VIVO</span></span>
        <button type="button" class="icon-btn-44 fp-close-btn" id="fpCloseBtn" aria-label="Minimizar reproductor">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </div>
    </div>

    <div class="fp-body">
      <div class="fp-art-frame" id="fpArtFrame">
        <img id="fpArt" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="" />
      </div>

      <div class="fp-info">
        <span class="fp-freq" id="fpFreq"></span>
        <h2 class="fp-station" id="fpStation"></h2>
        <p class="fp-program" id="fpProgram"></p>
      </div>

      <div class="fp-visualizer" id="fpVisualizer" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </div>

      <div class="fp-transport">
        <button type="button" class="icon-btn-48 fp-side-btn" id="fpPrevStationBtn" aria-label="Emisora anterior">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>
        <button type="button" class="fp-play-main" id="fpPlayBtn" aria-label="Reproducir o pausar"></button>
        <button type="button" class="icon-btn-48 fp-side-btn" id="fpNextStationBtn" aria-label="Siguiente emisora">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
        </button>
      </div>

      <div class="fp-utility-row">
        <button type="button" class="fp-util-chip" id="fpSleepBtn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <span id="fpSleepLabel">Temporizador</span>
        </button>
        <button type="button" class="fp-util-chip" id="fpAirplayBtn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 17H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-1"/><polygon points="12 15 17 21 7 21 12 15"/></svg>
          <span>AirPlay / Cast</span>
        </button>
        <button type="button" class="fp-util-chip" id="fpShareBtn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
          <span>Compartir</span>
        </button>
      </div>
    </div>
  </section>

  <!-- Top-Layer Native Modal Dialog (Light-dismiss + @starting-style + Safari fallback) -->
  <dialog id="modalDialog" class="credo-dialog" closedby="any" aria-labelledby="modalTitle"></dialog>

  <!-- Familia Credo One Global Bottom Sheet Dialog (Non-Top-Layer z-index 960 so PayPal v6/v5 overlays & 3DS never get trapped!) -->
  <div id="coSheetBackdrop" class="co-sheet-backdrop" hidden></div>
  <dialog id="credoOneDialog" class="co-sheet-dialog" aria-modal="true" aria-labelledby="coSheetTitle"></dialog>

  <!-- Official Story Viewer Dialog -->
  <dialog id="storyDialog" class="story-dialog" closedby="any" aria-label="Destacado oficial"></dialog>

  <!-- Live Toast Feedback -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Persistent Hardware Audio Elements for Live Radio & Neural Human Voice -->
  <audio id="credoLiveAudio" preload="none" playsinline style="display:none"></audio>
  <audio id="credoTtsAudio" preload="none" playsinline style="display:none"></audio>

  <script type="module" src="/app.js?v=48"></script>
</body>
</html>
