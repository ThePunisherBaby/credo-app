name: Credo Android APK Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode release keystore (if configured in secrets)
        if: ${{ secrets.CREDO_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.CREDO_KEYSTORE_BASE64 }}" | base64 -d > /tmp/credo-release.jks
          echo "CREDO_KEYSTORE_PATH=/tmp/credo-release.jks" >> "$GITHUB_ENV"

      - name: Build Signed Release APK
        working-directory: android-app
        env:
          CREDO_KEYSTORE_PASS: ${{ secrets.CREDO_KEYSTORE_PASS }}
          CREDO_KEY_ALIAS: ${{ secrets.CREDO_KEY_ALIAS }}
          CREDO_KEY_PASS: ${{ secrets.CREDO_KEY_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK artifact
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG_NAME="${{ github.event.inputs.tag }}"
          fi
          APK_SRC=$(ls android-app/app/build/outputs/apk/release/*.apk | head -n 1)
          mkdir -p dist
          cp "$APK_SRC" "dist/Credo-${TAG_NAME}.apk"
          sha256sum "dist/Credo-${TAG_NAME}.apk" > "dist/Credo-${TAG_NAME}.apk.sha256"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Credo ${{ env.TAG_NAME }}
          generate_release_notes: true
          files: |
            dist/Credo-${{ env.TAG_NAME }}.apk
            dist/Credo-${{ env.TAG_NAME }}.apk.sha256
